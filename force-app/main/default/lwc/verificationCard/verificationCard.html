<template>
  <div class="card-wrapper">
    <lightning-card title={cardTitle} icon-name="standard:approval">
      <template lwc:if={hasRows}>
        <template lwc:if={isNotInert}>
          <div slot="actions">
            <lightning-button
              label="Verify All Proposed"
              variant="brand"
              icon-name="utility:check"
              onclick={handleVerifyAll}
              disabled={noProposed}
            >
            </lightning-button>
          </div>
        </template>
      </template>

      <!-- Loading -->
      <template lwc:if={isLoading}>
        <div class="slds-p-around_large slds-text-align_center">
          <lightning-spinner
            alternative-text="Loading"
            size="small"
          ></lightning-spinner>
        </div>
      </template>

      <!-- Error -->
      <template lwc:if={error}>
        <div class="slds-p-around_medium">
          <div
            class="slds-box slds-theme_error slds-notify slds-notify_alert"
            role="alert"
          >
            <span class="slds-assistive-text">Error</span>
            <p class="slds-text-body_small">{error}</p>
          </div>
        </div>
      </template>

      <!-- Empty -->
      <template lwc:if={isEmpty}>
        <div
          class="slds-p-around_medium slds-text-align_center slds-text-color_weak"
        >
          No records to verify.
        </div>
      </template>

      <!-- Unreviewed legacy banner — shown when null-status records exist.
           These predate the source sync framework and are not yet actionable.
           The banner informs the PI so they know more records will appear once
           the sync handler runs. -->
      <template lwc:if={hasUnreviewed}>
        <div class="slds-p-horizontal_medium slds-p-top_small">
          <div
            class="slds-notify slds-notify_alert slds-theme_info slds-grid slds-grid_vertical-align-center"
            role="status"
          >
            <lightning-icon
              icon-name="utility:info"
              size="xx-small"
              class="slds-m-right_x-small"
              alternative-text="Info"
            ></lightning-icon>
            <span class="slds-text-body_small">{unreviewedMessage}</span>
          </div>
        </div>
      </template>

      <!-- Rows -->
      <template lwc:if={hasRows}>
        <ul class="slds-has-dividers_around-space verification-list">
          <template for:each={rows} for:item="row">
            <li key={row.recordId} class={row.cssClass}>
              <!-- Status chip header — replaces the left-border colour bar -->
              <div class="vc-row-topbar">
                <span class={row.statusChipClass}>
                  <lightning-icon
                    icon-name={row.statusIcon}
                    size="xx-small"
                    class="vc-chip-icon"
                    alternative-text={row.status}
                  ></lightning-icon>
                  {row.status}
                </span>
              </div>
              <div
                class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-wrap"
              >
                <!-- Field display -->
                <div
                  class="slds-col slds-size_9-of-12 slds-align-middle verification-col_fields"
                >
                  <!-- No-source-data warning for Proposed rows awaiting sync -->
                  <template lwc:if={row.noSourceData}>
                    <div
                      class="slds-text-color_weak slds-text-body_small slds-m-bottom_x-small vc-no-source-warning"
                    >
                      <lightning-icon
                        icon-name="utility:warning"
                        size="xx-small"
                        class="slds-m-right_xx-small"
                        alternative-text="Warning"
                      ></lightning-icon>
                      Source data not yet synced — verify after the sync handler
                      runs.
                    </div>
                  </template>

                  <template for:each={row.displayFields} for:item="f">
                    <div
                      key={f.apiName}
                      class="slds-grid slds-p-vertical_xx-small"
                    >
                      <div
                        class="slds-col slds-size_5-of-12 slds-text-color_weak slds-text-body_small verification-col_label"
                      >
                        {f.label}
                      </div>
                      <div
                        class="slds-col slds-size_7-of-12 verification-col_value"
                      >
                        <template lwc:if={f.isOverridden}>
                          <span
                            class="overridden-value"
                            title={f.sourceTooltip}
                          >
                            <span class="slds-truncate overridden-text"
                              >{f.displayValue}</span
                            >
                            <lightning-icon
                              icon-name="utility:edit"
                              size="xx-small"
                              class="slds-m-left_xx-small overridden-icon"
                              alternative-text="Corrected"
                            >
                            </lightning-icon>
                          </span>
                        </template>
                        <template lwc:else>
                          <span class="slds-truncate">{f.displayValue}</span>
                        </template>
                      </div>
                    </div>
                  </template>

                  <template lwc:if={row.verifiedFootnote}>
                    <div
                      class="slds-text-color_weak slds-text-body_small slds-m-top_x-small verification-footnote"
                    >
                      {row.verifiedFootnote}
                    </div>
                  </template>
                </div>

                <!-- Actions — only rendered when card is not inert -->
                <div
                  class="slds-col slds-size_3-of-12 slds-align-middle verification-col_actions"
                >
                  <div
                    class="slds-grid slds-grid_align-end slds-grid_vertical-align-center"
                  >
                    <template lwc:if={row.canVerify}>
                      <lightning-button
                        label="Verify"
                        variant="brand-outline"
                        data-record-id={row.recordId}
                        onclick={handleVerifyOne}
                      >
                      </lightning-button>
                    </template>
                    <template lwc:if={row.canReject}>
                      <lightning-button
                        label="Reject"
                        variant="destructive-text"
                        data-record-id={row.recordId}
                        onclick={handleRejectOne}
                        class="slds-m-left_x-small"
                      >
                      </lightning-button>
                    </template>
                    <!-- Confirm Manual — for PI-entered records with no source counterpart -->
                    <template lwc:if={row.canConfirmManual}>
                      <lightning-button
                        label="Confirm"
                        variant="success"
                        data-record-id={row.recordId}
                        onclick={handleConfirmManual}
                        title="Attest this manually-entered record is accurate"
                      >
                      </lightning-button>
                    </template>
                  </div>
                </div>
              </div>
            </li>
          </template>
        </ul>
      </template>
    </lightning-card>
  </div>

  <!-- Reject confirmation modal -->
  <template lwc:if={showRejectModal}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="reject-modal-heading"
      class="slds-modal slds-fade-in-open"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <button
            type="button"
            class="slds-button slds-button_icon slds-modal__close"
            onclick={handleRejectCancel}
          >
            <lightning-icon
              icon-name="utility:close"
              size="small"
              alternative-text="Close"
            ></lightning-icon>
          </button>
          <h2
            id="reject-modal-heading"
            class="slds-modal__title slds-hyphenate"
          >
            Exclude record
          </h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <p class="slds-m-bottom_small slds-text-body_regular">
            This record will be excluded from the verification set. Provide a
            reason (optional).
          </p>
          <lightning-input
            label="Exclusion reason"
            value={_rejectReason}
            onchange={handleRejectReasonChange}
            placeholder="e.g. Duplicate, Not applicable, Out of scope"
          >
          </lightning-input>
        </div>
        <footer class="slds-modal__footer">
          <button
            type="button"
            class="slds-button slds-button_neutral"
            onclick={handleRejectCancel}
          >
            Cancel
          </button>
          <button
            type="button"
            class="slds-button slds-button_destructive"
            onclick={handleRejectConfirm}
          >
            Confirm Exclusion
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
