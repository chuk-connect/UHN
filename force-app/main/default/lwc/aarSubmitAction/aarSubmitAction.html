<template>
  <div class="slds-p-around_medium">
    <template if:true={isLoading}>
      <lightning-spinner
        alternative-text="Submitting..."
        size="medium"
      ></lightning-spinner>
    </template>

    <template if:false={isLoading}>
      <template if:false={isSubmitted}>
        <!-- Pre-flight checklist -->
        <p class="slds-text-body_regular slds-m-bottom_medium">
          Review the checklist below before submitting your AAR. All items must
          be complete.
        </p>

        <template if:true={validationErrors.length}>
          <div class="slds-box slds-theme_error slds-m-bottom_medium">
            <p class="slds-text-heading_small slds-m-bottom_x-small">
              Please complete the following before submitting:
            </p>
            <ul class="slds-list_dotted">
              <template for:each={validationErrors} for:item="err">
                <li key={err}>{err}</li>
              </template>
            </ul>
          </div>
        </template>

        <ul class="slds-checklist slds-m-bottom_medium">
          <li class={cMaRSClass}>
            CMaRS Conflict of Interest disclosure updated
          </li>
          <li class={grantsClass}>All grants in good standing</li>
          <li class={trainingClass}>Mandatory training complete</li>
          <li class={formClass}>Form confirmed accurate</li>
        </ul>

        <div class="slds-grid slds-gutters_small slds-m-top_medium">
          <div class="slds-col">
            <lightning-button
              label="Cancel"
              variant="neutral"
              onclick={handleCancel}
            >
            </lightning-button>
          </div>
          <div class="slds-col">
            <lightning-button
              label="Submit AAR"
              variant="brand"
              disabled={hasErrors}
              onclick={handleSubmit}
            >
            </lightning-button>
          </div>
        </div>
      </template>

      <template if:true={isSubmitted}>
        <div class="slds-box slds-theme_success slds-text-align_center">
          <lightning-icon
            icon-name="utility:check"
            variant="success"
            size="large"
          ></lightning-icon>
          <p class="slds-text-heading_medium slds-m-top_medium">
            AAR Submitted Successfully
          </p>
          <p class="slds-text-body_regular slds-m-top_small">
            Your Annual Activity Report has been submitted for review.
          </p>
        </div>
      </template>
    </template>
  </div>
</template>
